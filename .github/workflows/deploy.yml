name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    # 計算のテストが落ちたら本番に反映しない
    - name: Test
      run: dotnet test tests/MahjongApp.Tests

    - name: Publish Blazor App
      run: dotnet publish MahjongApp.csproj -c Release -o release

    # 公開する前に、公開物そのものを画面テストする（Worker は本物のコードを代役のサーバーで動かす）
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Test feedback encryption
      run: node --test tests/js/feedback.test.mjs

    - name: Install browser for screen tests
      run: |
        dotnet build tests/MahjongApp.E2E -c Release
        pwsh tests/MahjongApp.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

    - name: Screen tests
      env:
        E2E_WWWROOT: ${{ github.workspace }}/release/wwwroot
        E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
      # 失敗したテストを GitHub の注記に出す（ログを開かなくても原因が分かるように）
      run: dotnet test tests/MahjongApp.E2E -c Release --no-build --logger GitHubActions

    - name: Upload screen test recordings
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-recordings
        path: e2e-artifacts

    - name: Fix GitHub Pages settings
      run: |
        touch release/wwwroot/.nojekyll
        cp release/wwwroot/index.html release/wwwroot/404.html

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './release/wwwroot'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4