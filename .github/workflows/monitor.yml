name: Daily operations check

# KV の書き込み回数と問い合わせの新着を毎日調べ、知らせることがあれば「運用通知」の Issue に書く（GitHub からメールが届く）
on:
  schedule:
    - cron: '30 23 * * *' # 毎日 23:30 UTC（日本時間 8:30）。その日の UTC の書き込み回数がほぼ出そろう時刻
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Check usage and feedback
      id: check
      env:
        CLOUDFLARE_MONITOR_TOKEN: ${{ secrets.CLOUDFLARE_MONITOR_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        KV_NAMESPACE_ID: 24c6cbf3a57e4698be02e555c8475cfb # cloudflare/wrangler.toml と同じ
      run: node .github/scripts/monitor.mjs > report.md

    - name: Notify via issue
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ ! -s report.md ]; then echo "知らせることはありません"; exit 0; fi
        number=$(gh issue list --state open --search "運用通知 in:title" --json number --jq '.[0].number')
        if [ -n "$number" ]; then
          gh issue comment "$number" --body-file report.md
        else
          gh issue create --title "運用通知" --body-file report.md
        fi
