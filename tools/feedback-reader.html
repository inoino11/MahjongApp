<!DOCTYPE html>
<!-- 問い合わせを読む。運営者が手元のブラウザで開く（公開しない）。秘密鍵はこのページの中でだけ使い、保存も送信もしない -->
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>問い合わせを読む</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; line-height: 1.7; color: #222; }
        textarea { width: 100%; height: 10em; font-family: Consolas, monospace; }
        button { font-size: 1rem; padding: 6px 16px; }
        .item { border: 1px solid #ccc; border-radius: 8px; padding: 12px 16px; margin: 12px 0; white-space: pre-wrap; }
        .ng { color: #b71c1c; font-weight: bold; }
        .meta { color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>問い合わせを読む</h1>
    <ol>
        <li>秘密鍵のファイル（tagamsigma-feedback-private-key.json）を選びます: <input type="file" id="keyFile" accept=".json" /> <span id="keyState"></span></li>
        <li>
            Cloudflare のダッシュボード（Storage &amp; Databases → KV → 名前空間）で、キーを <code>feedback:</code> で絞り込み、値をコピーして貼り付けます。<br />
            複数をまとめて読むときは、1 行に 1 件ずつ貼り付けます。
        </li>
    </ol>
    <textarea id="input" placeholder='{"v":1,"epk":"...","iv":"...","ct":"..."}'></textarea>
    <p><button id="read">読む</button></p>
    <div id="output"></div>

    <script src="../wwwroot/js/feedback.js"></script>
    <script>
        let privateJwk = null;
        document.getElementById("keyFile").addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                privateJwk = JSON.parse(await file.text());
                document.getElementById("keyState").textContent = "✓ 読み込みました";
            } catch {
                privateJwk = null;
                document.getElementById("keyState").innerHTML = '<span class="ng">秘密鍵のファイルではありません</span>';
            }
        });

        const escapeHtml = (s) => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        document.getElementById("read").addEventListener("click", async () => {
            const output = document.getElementById("output");
            output.innerHTML = "";
            if (!privateJwk) { output.innerHTML = '<p class="ng">先に秘密鍵のファイルを選んでください。</p>'; return; }
            const lines = document.getElementById("input").value.split("\n").map(l => l.trim()).filter(l => l);
            for (const line of lines) {
                const div = document.createElement("div");
                div.className = "item";
                try {
                    // ダッシュボードの値は、保存時刻なども含む JSON（{ encrypted, receivedAt }）。暗号文だけを貼っても読める
                    const record = JSON.parse(line);
                    const envelope = record.encrypted ?? line;
                    const plain = JSON.parse(await feedbackCrypto.decrypt(typeof envelope === "string" ? envelope : JSON.stringify(envelope), privateJwk));
                    div.innerHTML =
                        `<div class="meta">受信: ${escapeHtml(record.receivedAt ?? "不明")} ／ 種類: ${escapeHtml(plain.category ?? "")}</div>` +
                        `<div>${escapeHtml(plain.message ?? "")}</div>` +
                        (plain.contact ? `<div class="meta">連絡先: ${escapeHtml(plain.contact)}</div>` : "") +
                        (plain.environment ? `<div class="meta">環境: ${escapeHtml(plain.environment)}</div>` : "");
                } catch (e) {
                    div.innerHTML = `<span class="ng">読めませんでした（${escapeHtml(e.message || String(e))}）</span><div class="meta">${escapeHtml(line.slice(0, 80))}…</div>`;
                }
                output.appendChild(div);
            }
        });
    </script>
</body>
</html>
