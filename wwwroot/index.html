    <script>
        // 起動に失敗したときの復旧処理: Service Worker とキャッシュを破棄して再読み込みする
        window.recoverPwaAndReload = async function () {
            const btn = document.getElementById('recovery-btn');
            if (btn) {
                btn.innerText = "修復中...";
                btn.disabled = true;
                btn.style.opacity = "0.7";
            }
            // 1. Service Worker の登録を全解除
            if ('serviceWorker' in navigator) {
                try {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                    }
                } catch (err) {
                    console.error("SW解除エラー:", err);
                }
            }

            // 2. Cache Storage を全消去（古いDLLやアセットを消す）
            if ('caches' in window) {
                try {
                    const keys = await caches.keys();
                    for (let key of keys) {
                        await caches.delete(key);
                    }
                } catch (err) {
                    console.error("キャッシュ消去エラー:", err);
                }
            }

            // 3. サーバーから最新ファイルを強制取得してリロード
            window.location.reload(true);
        };

        // Blazor を手動で起動し、失敗したらローディング画面を復旧ボタンに差し替える
        Blazor.start().then(() => {
            const loader = document.getElementById('mahjong-loader');
            if (loader) {
                // 成功時のローディング画面の消去は、初回描画後に C# 側（MainLayout）から hideMahjongLoader で行う
            }
        }).catch((error) => {
            // 起動に失敗した場合
            console.error("Blazor起動エラー:", error);
            const loader = document.getElementById('mahjong-loader');
            if (loader) {
                // ローディングアニメーションをエラーメッセージと修復ボタンに書き換える
                loader.innerHTML = `
                    <div style="font-size: 4rem; margin-bottom: 16px;">🚨</div>
                    <div style="font-size: 1.2rem; font-weight: bold; color: #ff6b6b; margin-bottom: 12px; letter-spacing: 0.1em;">
                        アプリの起動に失敗しました
                    </div>
                    <div style="font-size: 0.9rem; color: #e0e0e0; text-align: center; line-height: 1.6; margin-bottom: 24px; padding: 0 20px;">
                        アップデートの競合、またはキャッシュが<br/>破損している可能性があります。
                    </div>
                    <button id="recovery-btn" onclick="recoverPwaAndReload()" style="background-color: #ef5350; color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: background-color 0.2s;">
                        修復して再読み込み
                    </button>
                `;
            }
            // Blazor 標準のエラーバー（blazor-error-ui）は、独自の全画面エラーと重なるので隠す
            const errorUi = document.getElementById('blazor-error-ui');
            if (errorUi) {
                errorUi.style.display = 'none';
            }
        });
        // 新しいバージョンを検知したら、確認のうえ切り替えて再読み込みする
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').then(registration => {
                registration.onupdatefound = () => {
                    const installingWorker = registration.installing;
                    if (installingWorker == null) {
                        return;
                    }
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            if (confirm("アプリの新しいバージョンがあります。\n更新して再読み込みしますか？")) {
                                installingWorker.postMessage('SKIP_WAITING');
                            }
                        }
                    };
                };
            });
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    window.location.reload();
                    refreshing = true;
                }
            });
        }
    </script>
