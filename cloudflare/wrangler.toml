# Worker の設定。GitHub Actions（.github/workflows/deploy-worker.yml）がこの内容でデプロイする。
# ダッシュボードで変えた設定は次のデプロイで上書きされるため、変更はここで行う
name = "mahjong-share" # 旧 URL の mahjong-share.inoino11.workers.dev と一致させる
main = "mahjong-share-worker.js"
compatibility_date = "2026-06-11"
# 呼び出し先は独自ドメイン（DNS と証明書は Cloudflare が用意する）。
# workers.dev も残し、端末に残った古いアプリからの呼び出しを受け続ける
routes = [{ pattern = "api.inoino11.com", custom_domain = true }]
workers_dev = true

[[kv_namespaces]]
binding = "MAHJONG_KV"
id = "24c6cbf3a57e4698be02e555c8475cfb"

# 問い合わせの連投を防ぐ（同じ送信元から 1 分に 3 件まで）。KV の書き込みを使わずに数える
[[ratelimits]]
name = "FEEDBACK_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }
